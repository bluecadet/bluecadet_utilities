phpunit_target: tests/src

# PR matrix: the latest release of each supported major. Add 12.0.x when it
# releases (week of 2026-12-07).
pr_matrix:
  drupal_core: ['10.6.x', '11.4.x']
  php_version: ['8.2', '8.3', '8.4']
  mariadb_version: ['10.6']
  exclude:
    - drupal_core: '10.6.x'
      php_version: '8.4'
    - drupal_core: '11.4.x'
      php_version: '8.2'

# Full matrix: every supported minor plus the next one in development.
# 12.0.x requires PHP 8.5 and is expected to fail until the module widens its
# core constraints and the test image gains a PHP 8.5 tag.
full_matrix:
  drupal_core: ['10.6.x', '11.3.x', '11.4.x', '11.5.x', '12.0.x']
  php_version: ['8.2', '8.3', '8.4', '8.5']
  mariadb_version: ['10.4', '10.6']
  exclude:
    - drupal_core: '10.6.x'
      php_version: '8.4'
    - drupal_core: '10.6.x'
      php_version: '8.5'
    - drupal_core: '11.3.x'
      php_version: '8.2'
    - drupal_core: '11.3.x'
      php_version: '8.5'
    - drupal_core: '11.3.x'
      mariadb_version: '10.4'
    - drupal_core: '11.4.x'
      php_version: '8.2'
    - drupal_core: '11.4.x'
      php_version: '8.5'
    - drupal_core: '11.4.x'
      mariadb_version: '10.4'
    - drupal_core: '11.5.x'
      php_version: '8.2'
    - drupal_core: '11.5.x'
      php_version: '8.5'
    - drupal_core: '11.5.x'
      mariadb_version: '10.4'
    - drupal_core: '12.0.x'
      php_version: '8.2'
    - drupal_core: '12.0.x'
      php_version: '8.3'
    - drupal_core: '12.0.x'
      php_version: '8.4'
    - drupal_core: '12.0.x'
      mariadb_version: '10.4'
