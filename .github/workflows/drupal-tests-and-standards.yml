name: Module tests and standards
on:
  workflow_dispatch:
    inputs:
      drupal_core:
        description: Drupal core branch for targeted run
        required: true
        default: '11.2.x'
        type: string
      php_version:
        description: PHP version for targeted run
        required: true
        default: '8.4'
        type: string
      mariadb_version:
        description: MariaDB version for targeted run
        required: true
        default: '10.6'
        type: string
      phpunit_target:
        description: PHPUnit path or file under module root
        required: true
        default: 'tests/src/Functional/BluecadetUtilitiesTest.php'
        type: string
  schedule:
    # GitHub Actions cron uses UTC. 06:00 UTC is 1:00 AM ET (EST) / 2:00 AM ET (EDT).
    - cron: '0 6 1 * *'
  push:
    branches: [ 5.x ]
  pull_request:
    branches: [ 5.x ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    uses: bluecadet/web-gh-actions/.github/workflows/drupal-tests-and-standards.yml@feature/drupal-ci-orchestrator
    with:
      event_name: ${{ github.event_name }}
      dispatch_drupal_core: ${{ inputs.drupal_core }}
      dispatch_php_version: ${{ inputs.php_version }}
      dispatch_mariadb_version: ${{ inputs.mariadb_version }}
      dispatch_phpunit_target: ${{ inputs.phpunit_target }}
