name: Module tests and standards
on:
  workflow_dispatch:
    inputs:
      drupal_core:
        description: Drupal core branch for targeted run
        required: true
        default: '11.2.x'
        type: string
      php_version:
        description: PHP version for targeted run
        required: true
        default: '8.4'
        type: string
      mariadb_version:
        description: MariaDB version for targeted run
        required: true
        default: '10.6'
        type: string
      phpunit_target:
        description: PHPUnit path or file under module root
        required: true
        default: 'tests/src/Functional/BluecadetUtilitiesTest.php'
        type: string
  schedule:
    # GitHub Actions cron uses UTC. 06:00 UTC is 1:00 AM ET (EST) / 2:00 AM ET (EDT).
    - cron: '0 6 1 * *'
  push:
    branches: [ 5.x ]
  pull_request:
    branches: [ 5.x ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-target:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      pull-requests: write
    name: Targeted | D${{ inputs.drupal_core }} | PHP${{ inputs.php_version }} | MariaDB${{ inputs.mariadb_version }}
    uses: ./.github/workflows/drupal-test-runner.yml
    with:
      drupal_core: ${{ inputs.drupal_core }}
      php_version: ${{ inputs.php_version }}
      mariadb_version: ${{ inputs.mariadb_version }}
      phpunit_target: ${{ inputs.phpunit_target }}

  test-pr:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    name: PR matrix | D${{ matrix.drupal_core }} | PHP${{ matrix.php_version }} | MariaDB${{ matrix.mariadb_version }}
    strategy:
      fail-fast: false
      matrix:
        drupal_core:
          - '10.6.x'
          - '11.3.x'
        php_version:
          - '8.2'
          - '8.3'
          - '8.4'
        mariadb_version:
          - '10.6'
        exclude:
          - drupal_core: '10.6.x'
            php_version: '8.4'
          - drupal_core: '11.3.x'
            php_version: '8.2'
    uses: ./.github/workflows/drupal-test-runner.yml
    with:
      drupal_core: ${{ matrix.drupal_core }}
      php_version: ${{ matrix.php_version }}
      mariadb_version: ${{ matrix.mariadb_version }}

  test-full:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    permissions:
      contents: read
      pull-requests: write
    name: Full matrix | D${{ matrix.drupal_core }} | PHP${{ matrix.php_version }} | MariaDB${{ matrix.mariadb_version }}
    strategy:
      fail-fast: false
      matrix:
        drupal_core:
          - '10.5.x'
          - '10.6.x'
          - '11.2.x'
          - '11.3.x'
        php_version:
          - '8.2'
          - '8.3'
          - '8.4'
        mariadb_version:
          - '10.4'
          - '10.6'
        exclude:
          - drupal_core: '10.5.x'
            php_version: '8.4'
          - drupal_core: '10.6.x'
            php_version: '8.4'
          - drupal_core: '11.2.x'
            php_version: '8.2'
          - drupal_core: '11.2.x'
            mariadb_version: '10.4'
          - drupal_core: '11.3.x'
            php_version: '8.2'
          - drupal_core: '11.3.x'
            mariadb_version: '10.4'
    uses: ./.github/workflows/drupal-test-runner.yml
    with:
      drupal_core: ${{ matrix.drupal_core }}
      php_version: ${{ matrix.php_version }}
      mariadb_version: ${{ matrix.mariadb_version }}
